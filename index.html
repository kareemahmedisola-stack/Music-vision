<body>
<a class="skip" href="#app">Skip to game</a>
<div id="hud" class="hud" role="region" aria-label="Your progress">
  <button type="button" id="hudb" class="hud-b">
    <span class="chip c-streak" aria-hidden="true"><i>🔥</i><span><b id="hs">0</b><small>day streak</small></span></span>
    <span class="chip c-xp" aria-hidden="true"><i>⭐</i><span><b id="hx">0</b><small>XP</small></span></span>
    <span class="chip c-row" id="hrow" aria-hidden="true" hidden><i>🎯</i><span><b id="hr2">0</b><small>in a row</small></span></span>
  </button>
  <span class="hud-goal" aria-hidden="true"><i id="hg"></i></span>
</div>
<main id="app" tabindex="-1"></main>
<div id="sr" class="sr" role="status" aria-live="polite"></div>
<noscript><p style="padding:24px;font-family:sans-serif">Staffsounds needs JavaScript to run. Please enable it and reload.</p></noscript>
